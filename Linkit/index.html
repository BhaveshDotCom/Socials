<!doctype html>
<html lang="en" class="scroll-smooth scrollbar-none">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="/src/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@300..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/icon.svg" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkit</title>
  </head>
  <body class="bg-zinc-950 text-neutral-100 font-bold">

    <div class="mt-2 mb-5 justify-items-center">
        <header id="title" class="leading-loose text-3xl xl:text-7xl">Bhavesh Upadhyay</header>
    </div>

    <div class="flex gap-2 justify-self-center w-1/2 gap">
      <img class="animate-pulse opacity-70 h-5" src="/quote.svg"></img>
      <p id="quote" class="mt-3 opacity-70 xl:text-2xl text-center">The more you roam around, the more you find out.</p>
    </div>


    <main class="flex-1 flex-wrap xl:ml-50 xl:mr-50 justify-items-start p-10 mt-10"> 
      
      <!-- mail -->
      <div class="opacity-80 hover:opacity-100 hover:scale-101 w-full">
        <a class="flex items-center justify-between pl-2 pr-2" href="mailto:mail.bhavesh.in@gmail.com" target="_blank">
          <div class="xl:h-12 flex items-center gap-6">
            <img class="h-10" src="/mail.svg"></img>
            <h3 class="text-2xl">Mail</h3>
          </div>
          <div>
            <img class="h-10" src="/redirect.svg" alt="redirect">
          </div>
        </a>
      </div>

      <!-- LinkedIn -->
      <div class="w-full h-0.5  bg-amber-50 opacity-10 mt-6 mb-4"></div>
      <div class="opacity-70 hover:opacity-100 hover:scale-101 w-full">
        <a class="flex items-center justify-between pl-2 pr-2" href="https://www.linkedin.com/in/bhaveshupadhyay23/" target="_blank">
          <div class="xl:h-12 flex items-center gap-6">
            <img class="h-10" src="/linkedin.svg"></img>
            <h3 class="text-2xl">LinkedIn</h3>
          </div>
          <div>
            <img class="h-10" src="/redirect.svg" alt="redirect">
          </div>
        </a>
      </div>

      <div class="w-full h-0.5  bg-amber-50 opacity-10 mt-6 mb-4"></div>
      <!-- Leetcode -->
      <div class="opacity-80 hover:opacity-100 hover:scale-101 w-full">
        <a class="flex items-center justify-between pl-2 pr-2" href="https://leetcode.com/u/BhaveshDotCom/" target="_blank">
          <div class="xl:h-12 flex items-center gap-6">
            <img class="h-10" alt="Leetcode" src="/leetcode.svg"></img>
            <h3 class="text-2xl">Leetcode</h3>
          </div>
          <div>
            <img class="h-10" src="/redirect.svg" alt="redirect">
          </div>
        </a>
      </div>

      <div class="w-full h-0.5  bg-amber-50 opacity-10 mt-6 mb-4"></div>

      <!-- Github -->
      <div class="opacity-80 hover:opacity-100 hover:scale-101 w-full">
        <a class="flex items-center justify-between pl-2 pr-2" href="https://github.com/BhaveshDotCom/" target="_blank">
          <div class="xl:h-12 flex items-center gap-6">
            <img class="h-10" src="/github.svg"></img>
            <h3 class="text-2xl">GitHub</h3>
          </div>
          <div>
            <img class="h-10" src="/redirect.svg" alt="redirect">
          </div>
        </a>
      </div>

      <div class="w-full h-0.5  bg-amber-50 opacity-10 mt-6 mb-4"></div>

      <!-- Medium -->
      <div class="opacity-80 hover:opacity-100 hover:scale-101 w-full">
        <a class="flex items-center justify-between pl-2 pr-2" href="https://medium.com/@BhaveshDotCom" target="_blank">
          <div class="xl:h-12 flex items-center gap-6">
            <img class="h-10" src="/medium.svg"></img>
            <h3 class="text-2xl">Medium</h3>
          </div>
          <div>
            <img class="h-10" src="/redirect.svg" alt="redirect">
          </div>
        </a>
      </div>

      <!-- X -->
      <div class="w-full h-0.5  bg-amber-50 opacity-10 mt-6 mb-4"></div>
      <div class="opacity-80 hover:opacity-100 hover:scale-101 w-full">
        <a class="flex items-center justify-between pl-2 pr-2" href="https://x.com/BhaveshDotCom" target="_blank">
          <div class="xl:h-12 flex items-center gap-6">
            <img class="h-10" src="/twitter.svg"></img>
            <h3 class="text-2xl">X</h3>
          </div>
          <div>
            <img class="h-10" src="/redirect.svg" alt="redirect">
          </div>
        </a>
      </div>

      <div class="w-full h-0.5  bg-amber-50 opacity-10 mt-6 mb-4"></div>
    </main>
  </body>
</html>
